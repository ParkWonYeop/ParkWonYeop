<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title description">
  <title id="title">About Park Won Yeop</title>
  <desc id="description">Animated terminal card describing a backend engineer focused on performance, modernization, and operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090B"/><stop offset="1" stop-color="#11150E"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#FAFAFA" stroke-opacity="0.025"/></pattern>
    <clipPath id="command"><rect x="62" y="119" width="0" height="27"><animate attributeName="width" calcMode="discrete" values="0;0;9.05;18.10;27.15;36.20;45.25;54.30;63.35;72.40;81.45;90.50;99.55;108.60;117.65;126.70;135.75;144.80;153.85;162.90;171.95;181;181;0" keyTimes="0;0.08;0.097;0.114;0.131;0.148;0.165;0.182;0.199;0.216;0.233;0.25;0.267;0.284;0.301;0.318;0.335;0.352;0.369;0.386;0.403;0.42;0.92;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="408" rx="18" fill="url(#bg)" stroke="#27272A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="408" rx="18" fill="url(#grid)"/>

  <text x="42" y="46" fill="#B6F13A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="800" letter-spacing="2">00 / ABOUT.EXE</text>
  <text x="1156" y="46" text-anchor="end" fill="#52525B" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">PROCESS 9679 · RUNNING</text>

  <g>
    <rect x="42" y="70" width="708" height="294" rx="12" fill="#070708" stroke="#3F3F46" stroke-opacity="0.7"/>
    <path d="M42 104H750" stroke="#27272A"/>
    <circle cx="64" cy="87" r="4" fill="#3F3F46"/><circle cx="78" cy="87" r="4" fill="#52525B"/><circle cx="92" cy="87" r="4" fill="#B6F13A"/>
    <text x="396" y="91" text-anchor="middle" fill="#52525B" font-family="ui-monospace, monospace" font-size="9" letter-spacing="1">~/profile/about</text>

    <g clip-path="url(#command)"><text x="62" y="139" textLength="181" lengthAdjust="spacingAndGlyphs" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15"><tspan fill="#B6F13A">$</tspan> ./whoami --verbose</text></g>
    <rect x="62" y="122" width="8" height="21" fill="#B6F13A" filter="url(#glow)">
      <animate attributeName="x" calcMode="discrete" values="62;62;76.05;85.10;94.15;103.20;112.25;121.30;130.35;139.40;148.45;157.50;166.55;175.60;184.65;193.70;202.75;211.80;220.85;229.90;238.95;248;248;62" keyTimes="0;0.08;0.097;0.114;0.131;0.148;0.165;0.182;0.199;0.216;0.233;0.25;0.267;0.284;0.301;0.318;0.335;0.352;0.369;0.386;0.403;0.42;0.92;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">
      <text x="62" y="188" fill="#FAFAFA" opacity="0">복잡한 문제를 직시하고, 끝까지 추적합니다.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="7s" repeatCount="indefinite"/></text>
      <text x="62" y="226" fill="#A1A1AA" opacity="0">병목을 줄이고 레거시를 안전하게 바꾸며,<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="7s" repeatCount="indefinite"/></text>
      <text x="62" y="264" fill="#A1A1AA" opacity="0">직접 운영해 장애에 강한 시스템을 만듭니다.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="7s" repeatCount="indefinite"/></text>
    </g>
    <text x="62" y="322" fill="#52525B" font-family="ui-monospace, monospace" font-size="11" letter-spacing="1">EXIT CODE: STILL SHIPPING</text>
  </g>

  <g transform="translate(782 70)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g>
      <rect width="376" height="84" rx="10" fill="#0B0C0A" stroke="#B6F13A" stroke-opacity="0.34"/>
      <text x="20" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.5">01 / PERFORMANCE</text>
      <text x="20" y="55" fill="#D4D4D8" font-size="13">observe → measure → remove bottlenecks</text>
      <rect x="345" y="17" width="10" height="50" rx="5" fill="#B6F13A" opacity="0.15"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="3s" repeatCount="indefinite"/></rect>
    </g>
    <g transform="translate(0 105)">
      <rect width="376" height="84" rx="10" fill="#0B0C0A" stroke="#FAFAFA" stroke-opacity="0.13"/>
      <text x="20" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.5">02 / MODERNIZATION</text>
      <text x="20" y="55" fill="#D4D4D8" font-size="13">legacy → safe, clear, maintainable</text>
      <path d="M330 42H354M346 34L354 42L346 50" fill="none" stroke="#B6F13A" stroke-width="2"/>
    </g>
    <g transform="translate(0 210)">
      <rect width="376" height="84" rx="10" fill="#0B0C0A" stroke="#FAFAFA" stroke-opacity="0.13"/>
      <text x="20" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.5">03 / OPERATIONS</text>
      <text x="20" y="55" fill="#D4D4D8" font-size="13">homelab → production-minded decisions</text>
      <circle cx="350" cy="42" r="7" fill="#B6F13A" opacity="0.8"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>

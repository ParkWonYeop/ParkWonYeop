<svg xmlns="http://www.w3.org/2000/svg" width="390" height="690" viewBox="0 0 390 690" role="img" aria-labelledby="title description">
  <title id="title">About Park Won Yeop</title>
  <desc id="description">Mobile terminal card describing a backend engineer focused on performance, modernization, and operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090B"/><stop offset="1" stop-color="#11150E"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FAFAFA" stroke-opacity="0.025"/></pattern>
    <clipPath id="command"><rect x="38" y="113" width="0" height="26"><animate attributeName="width" calcMode="discrete" values="0;0;9;18;27;36;45;54;63;72;81;90;99;108;117;126;135;144;153;162;171;180;180;0" keyTimes="0;0.08;0.097;0.114;0.131;0.148;0.165;0.182;0.199;0.216;0.233;0.25;0.267;0.284;0.301;0.318;0.335;0.352;0.369;0.386;0.403;0.42;0.92;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="388" height="688" rx="18" fill="url(#bg)" stroke="#27272A" stroke-width="2"/><rect x="1" y="1" width="388" height="688" rx="18" fill="url(#grid)"/>
  <text x="22" y="40" fill="#B6F13A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="800" letter-spacing="1.5">00 / ABOUT.EXE</text>
  <text x="368" y="40" text-anchor="end" fill="#52525B" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.8">PROCESS 9679 · RUNNING</text>
  <rect x="20" y="58" width="350" height="292" rx="12" fill="#070708" stroke="#3F3F46" stroke-opacity="0.7"/><path d="M20 92H370" stroke="#27272A"/>
  <circle cx="39" cy="75" r="4" fill="#3F3F46"/><circle cx="53" cy="75" r="4" fill="#52525B"/><circle cx="67" cy="75" r="4" fill="#B6F13A"/><text x="195" y="79" text-anchor="middle" fill="#52525B" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.8">~/profile/about</text>
  <g clip-path="url(#command)"><text x="38" y="132" textLength="180" lengthAdjust="spacingAndGlyphs" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14"><tspan fill="#B6F13A">$</tspan> ./whoami --verbose</text></g>
  <rect x="38" y="115" width="8" height="20" fill="#B6F13A" filter="url(#glow)"><animate attributeName="x" calcMode="discrete" values="38;38;52;61;70;79;88;97;106;115;124;133;142;151;160;169;178;187;196;205;214;223;223;38" keyTimes="0;0.08;0.097;0.114;0.131;0.148;0.165;0.182;0.199;0.216;0.233;0.25;0.267;0.284;0.301;0.318;0.335;0.352;0.369;0.386;0.403;0.42;0.92;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.15;1" dur="0.75s" repeatCount="indefinite"/></rect>
  <g font-family="Pretendard, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">
    <text x="38" y="180" fill="#FAFAFA" opacity="0">복잡한 문제를 직시하고,<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="7s" repeatCount="indefinite"/></text><text x="38" y="204" fill="#FAFAFA" opacity="0">끝까지 추적합니다.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="38" y="242" fill="#A1A1AA" opacity="0">병목을 줄이고 레거시를 안전하게 바꾸며,<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="7s" repeatCount="indefinite"/></text>
    <text x="38" y="280" fill="#A1A1AA" opacity="0">직접 운영해 장애에 강한 시스템을<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="7s" repeatCount="indefinite"/></text><text x="38" y="304" fill="#A1A1AA" opacity="0">만듭니다.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.56;1" dur="7s" repeatCount="indefinite"/></text>
  </g>
  <text x="38" y="330" fill="#52525B" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.8">EXIT CODE: STILL SHIPPING</text>
  <g transform="translate(20 370)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <g><rect width="350" height="84" rx="10" fill="#0B0C0A" stroke="#B6F13A" stroke-opacity="0.34"/><text x="18" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.3">01 / PERFORMANCE</text><text x="18" y="56" fill="#D4D4D8" font-size="12">observe → measure → remove bottlenecks</text><rect x="327" y="17" width="8" height="50" rx="4" fill="#B6F13A" opacity="0.15"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="3s" repeatCount="indefinite"/></rect></g>
    <g transform="translate(0 104)"><rect width="350" height="84" rx="10" fill="#0B0C0A" stroke="#FAFAFA" stroke-opacity="0.13"/><text x="18" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.3">02 / MODERNIZATION</text><text x="18" y="56" fill="#D4D4D8" font-size="12">legacy → safe, clear, maintainable</text><path d="M312 42H332M324 34L332 42L324 50" fill="none" stroke="#B6F13A" stroke-width="2"/></g>
    <g transform="translate(0 208)"><rect width="350" height="84" rx="10" fill="#0B0C0A" stroke="#FAFAFA" stroke-opacity="0.13"/><text x="18" y="27" fill="#B6F13A" font-size="10" font-weight="800" letter-spacing="1.3">03 / OPERATIONS</text><text x="18" y="56" fill="#D4D4D8" font-size="12">homelab → production-minded decisions</text><circle cx="329" cy="42" r="7" fill="#B6F13A" opacity="0.8"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>

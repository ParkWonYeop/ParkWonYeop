<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Technical Toolbox System Map</title>
  <desc id="description">A graphical map of backend, data, infrastructure, and tooling skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09090B"/><stop offset="1" stop-color="#0D110A"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FAFAFA" opacity="0.045"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="url(#bg)" stroke="#27272A" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="428" rx="18" fill="url(#dots)"/>
  <text x="42" y="46" fill="#B6F13A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="800" letter-spacing="2">01 / TOOLBOX.MAP</text>
  <text x="1158" y="46" text-anchor="end" fill="#52525B" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.5">19 NODES · 03 LAYERS</text>

